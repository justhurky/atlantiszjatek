# nginx: https://eskivk.grafibee.hu → a játék (Node.js, 127.0.0.1:3000)
# A tanúsítvány (HTTPS) pl. a certbot-tal: certbot --nginx -d eskivk.grafibee.hu
server {
    listen 80;
    server_name eskivk.grafibee.hu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eskivk.grafibee.hu;

    ssl_certificate     /etc/letsencrypt/live/eskivk.grafibee.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eskivk.grafibee.hu/privkey.pem;

    # a fotók feltöltése miatt (a játék legfeljebb 5 MB-ot fogad)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
